# Runs on every push and pull request: type checks, unit tests, and the
# database integration tests against a real PostgreSQL + pgvector.
# (The AI evaluations need Ollama and run locally: npm run eval.)
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: botuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daneshjohandbot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U botuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://botuser:postgres@127.0.0.1:5433/daneshjohandbot_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
